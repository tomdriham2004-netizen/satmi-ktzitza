<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1b1640" />
    <title>סתמי קציצה: נכסים, דו-קרבות וכאוס מוחלט</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0e0b24; }
      #boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; align-content: center; gap: 26px;
        background: radial-gradient(1200px 700px at 50% 40%, #3b2c8f 0%, #1b1446 55%, #0e0b24 100%); transition: opacity .8s ease, visibility .8s; }
      #boot.done { opacity: 0; visibility: hidden; }
      .boot-logo { font: 900 clamp(48px, 9vw, 110px) system-ui, sans-serif; color: #fff; letter-spacing: .02em; text-shadow: 0 6px 0 #6a4cff, 0 12px 30px rgba(0,0,0,.4); animation: bp 1.6s ease-in-out infinite; }
      .boot-bar { width: min(360px, 60vw); height: 10px; border-radius: 10px; background: rgba(255,255,255,.12); overflow: hidden; }
      .boot-bar i { display: block; height: 100%; width: 30%; border-radius: 10px; background: linear-gradient(90deg, #ffc83d, #ff5d8f); animation: bb 1.1s ease-in-out infinite; }
      @keyframes bp { 50% { transform: scale(1.04) rotate(-1deg); } }
      @keyframes bb { 0% { transform: translateX(-110%); } 100% { transform: translateX(360%); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="gl"></div>
      <div id="labels"></div>
      <div id="ui"></div>
    </div>
    <div id="boot">
      <div class="boot-logo">סתמי קציצה</div>
      <div class="boot-bar"><i></i></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
